<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a3a"/>
      <stop offset="0.55" stop-color="#0a0f24"/>
      <stop offset="1" stop-color="#1b0f3a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#3b6cff" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#3b6cff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#3b6cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfe0ff"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#7c9cff"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="lamp" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="round"><rect x="0" y="0" width="1024" height="1024" rx="226"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#glow)"/>
    <!-- fine horizon lines: a hint of a room in perspective -->
    <g stroke="#7c9cff" stroke-opacity="0.10" stroke-width="3" fill="none">
      <path d="M0 700 L1024 700"/>
      <path d="M0 760 L1024 760"/>
      <path d="M0 830 L1024 830"/>
      <path d="M512 700 L120 1024"/>
      <path d="M512 700 L904 1024"/>
    </g>
  </g>

  <!-- glowing crossbar under the mark -->
  <rect x="232" y="268" width="560" height="96" rx="48" fill="url(#bar)" opacity="0.55" filter="url(#soft)"/>

  <!-- the T: crossbar + stem -->
  <rect x="232" y="268" width="560" height="96" rx="30" fill="url(#bar)"/>
  <rect x="452" y="268" width="120" height="480" rx="30" fill="url(#mark)"/>
  <!-- stem foot: a small base plate like a stand -->
  <rect x="372" y="716" width="280" height="40" rx="20" fill="url(#mark)" opacity="0.85"/>

  <!-- status lamp: Tikki is awake -->
  <circle cx="792" cy="238" r="34" fill="#22d3ee" opacity="0.9" filter="url(#lamp)"/>
  <circle cx="792" cy="238" r="22" fill="#e0fbff"/>
</svg>
